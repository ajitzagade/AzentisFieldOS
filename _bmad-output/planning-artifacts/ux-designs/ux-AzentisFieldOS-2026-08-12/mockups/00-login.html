<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AzentisFieldOS — Sign in</title>
<style>
/* ============================== TOKENS ============================== */
:root {
  /* ---- color: light ---- */
  --surface-0: #FBFAF7;   /* page background, "premium paper" */
  --surface-1: #FFFFFF;   /* card/panel surface */
  --surface-2: #F3F1EA;   /* sunken surface, table stripe, input fill */
  --surface-3: #EAE6DA;   /* deeper sunken, chip fill, active tab track */
  --border-hairline: #E4E0D3;
  --border-strong: #D2CBB8;
  --ink-900: #1B2430;
  --ink-700: #3E4757;
  --ink-500: #6B7280;
  --ink-on-accent: #F7F5EE;

  --accent-teal-900: #0B3B3E;
  --accent-teal-700: #0F5257;   /* primary action fill */
  --accent-teal-600: #14666C;   /* hover state */
  --accent-teal-100: #E4EFEE;   /* tint bg, row hover, selected row */

  --accent-navy-800: #16273E;
  --accent-navy-600: #223A5E;

  --gold-700: #96700F;   /* money text/icon only */
  --gold-500: #C7912B;   /* money fills/badges only */
  --gold-100: #FBF0DA;   /* money tint bg only */

  --success-700: #1E6B45; --success-100: #E4F3EA;
  --danger-700: #A32E2E;  --danger-100: #FBE7E5;
  --warning-700: #8A5A12; --warning-100: #FBF0DA;

  /* ---- type ---- */
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fs-2xs: 11px; --fs-xs: 12.5px; --fs-sm: 13.5px; --fs-base: 15px;
  --fs-md: 17px; --fs-lg: 21px; --fs-xl: 28px; --fs-2xl: 38px;

  /* ---- spacing (4px base) ---- */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;
  --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px; --sp-16: 64px;

  /* ---- radius ---- */
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px; --r-full: 999px;

  /* ---- elevation (soft layered shadow — never glassmorphism/blur) ---- */
  --shadow-1: 0 1px 2px rgba(27,36,48,.06), 0 1px 1px rgba(27,36,48,.04);
  --shadow-2: 0 4px 12px rgba(27,36,48,.08), 0 2px 4px rgba(27,36,48,.04);
  --shadow-3: 0 12px 32px rgba(27,36,48,.14), 0 4px 8px rgba(27,36,48,.06);
  --shadow-2-hover: 0 8px 20px rgba(27,36,48,.12), 0 3px 6px rgba(27,36,48,.06);

  /* ---- motion ---- */
  --ease: cubic-bezier(.2,.8,.2,1);
  --dur-fast: 110ms;
  --dur-base: 160ms;
}
.dark-scope {
  --surface-0: #12161C; --surface-1: #191F27; --surface-2: #212933; --surface-3: #2A3340;
  --border-hairline: #313B48; --border-strong: #414E5E;
  --ink-900: #F1EEE4; --ink-700: #C7CCD6; --ink-500: #8D95A3; --ink-on-accent: #12161C;
  --accent-teal-700: #4FB8AE; --accent-teal-600: #6BCFC5; --accent-teal-100: #1B3B3A;
  --gold-700: #E3B24B; --gold-500: #E3B24B; --gold-100: #2E2413;
  --success-700: #5FCF93; --success-100: #163527;
  --danger-700: #F0847E; --danger-100: #3A1E1E;
  --warning-700: #E3B24B; --warning-100: #2E2413;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4);
  --shadow-2: 0 6px 20px rgba(0,0,0,.45);
  --shadow-3: 0 16px 40px rgba(0,0,0,.5);
  --shadow-2-hover: 0 10px 26px rgba(0,0,0,.5);
}

* { box-sizing: border-box; }
body {
  margin: 0; font-family: var(--font); background: var(--surface-0); color: var(--ink-900);
  font-size: var(--fs-base); line-height: 1.5; -webkit-font-smoothing: antialiased;
}
.tabular { font-variant-numeric: tabular-nums lining-nums; }

/* ============================== APP SHELL ============================== */
.app-shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.sidebar {
  background: var(--accent-navy-800); color: var(--ink-on-accent);
  padding: var(--sp-6) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-1);
}
.sidebar .brand { display:flex; align-items:center; gap: var(--sp-2); padding: 0 var(--sp-2) var(--sp-6); }
.sidebar .brand-mark {
  width: 32px; height: 32px; border-radius: var(--r-md); background: var(--accent-teal-700);
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size: var(--fs-sm);
}
.sidebar .brand-name { font-size: var(--fs-md); font-weight: 650; letter-spacing: -.01em; }
.nav-group-label { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: .07em; color: #93A0B5; padding: var(--sp-4) var(--sp-2) var(--sp-1); }
.nav-link {
  display:flex; align-items:center; gap: var(--sp-3); padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-md); color: #C6CEDB; text-decoration:none; font-size: var(--fs-sm); font-weight: 500;
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
}
.nav-link svg { width:18px; height:18px; flex-shrink:0; }
.nav-link:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav-link.active { background: var(--accent-teal-700); color: #fff; }
.main { padding: var(--sp-8) var(--sp-10); max-width: 1240px; }
.topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom: var(--sp-8); }
.page-title { font-size: var(--fs-xl); font-weight: 650; letter-spacing: -.015em; margin:0 0 var(--sp-1); }
.page-sub { color: var(--ink-500); font-size: var(--fs-sm); margin:0; }
.breadcrumb { font-size: var(--fs-xs); color: var(--ink-500); margin-bottom: var(--sp-2); }
.breadcrumb a { color: var(--ink-500); text-decoration: none; }
.breadcrumb a:hover { color: var(--accent-teal-700); text-decoration: underline; }

/* ============================== CARDS (elevated) ============================== */
.card {
  background: var(--surface-1); border: 1px solid var(--border-hairline); border-radius: var(--r-lg);
  box-shadow: var(--shadow-2); padding: var(--sp-6);
  transition: box-shadow var(--dur-base) var(--ease), transform var(--dur-base) var(--ease);
}
.card.interactive { cursor: pointer; }
.card.interactive:hover { box-shadow: var(--shadow-2-hover); transform: translateY(-2px); }
.card-flat { background: var(--surface-1); border: 1px solid var(--border-hairline); border-radius: var(--r-lg); box-shadow: var(--shadow-1); padding: var(--sp-6); }

/* ============================== STAT TILES ============================== */
.stat-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: var(--sp-4); }
.stat-tile { background: var(--surface-1); border:1px solid var(--border-hairline); border-radius: var(--r-lg); box-shadow: var(--shadow-1); padding: var(--sp-5); transition: box-shadow var(--dur-base) var(--ease); }
.stat-tile:hover { box-shadow: var(--shadow-2); }
.stat-tile .stat-icon { width:34px; height:34px; border-radius: var(--r-md); display:flex; align-items:center; justify-content:center; margin-bottom: var(--sp-3); }
.stat-tile .stat-icon svg { width:18px; height:18px; }
.stat-tile .stat-value { font-size: var(--fs-2xl); font-weight: 700; letter-spacing:-.02em; }
.stat-tile .stat-label { font-size: var(--fs-xs); color: var(--ink-500); margin-top: var(--sp-1); }
.stat-icon.teal { background: var(--accent-teal-100); color: var(--accent-teal-700); }
.stat-icon.gold { background: var(--gold-100); color: var(--gold-700); }
.stat-icon.success { background: var(--success-100); color: var(--success-700); }
.stat-icon.danger { background: var(--danger-100); color: var(--danger-700); }

/* ============================== BUTTONS (icon + label) ============================== */
.btn {
  display:inline-flex; align-items:center; gap: var(--sp-2); font-family: var(--font);
  font-size: var(--fs-sm); font-weight: 600; padding: var(--sp-2) var(--sp-4); border-radius: var(--r-md);
  border: 1px solid transparent; cursor: pointer; text-decoration:none; white-space:nowrap;
  transition: background var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.btn svg { width:16px; height:16px; }
.btn-primary { background: var(--accent-teal-700); color:#fff; box-shadow: var(--shadow-1); }
.btn-primary:hover { background: var(--accent-teal-600); box-shadow: var(--shadow-2); transform: translateY(-1px); }
.btn-secondary { background: var(--surface-1); color: var(--ink-900); border-color: var(--border-strong); }
.btn-secondary:hover { background: var(--surface-2); border-color: var(--accent-teal-700); }
.btn-ghost { background: transparent; color: var(--ink-700); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink-900); }
.btn-sm { padding: var(--sp-1) var(--sp-3); font-size: var(--fs-xs); }
.btn-icon-only { padding: var(--sp-2); }
.btn:disabled { opacity:.5; cursor:not-allowed; transform:none !important; box-shadow:none !important; }

/* ============================== TABLES (zebra + hover) ============================== */
.table-wrap { background: var(--surface-1); border:1px solid var(--border-hairline); border-radius: var(--r-lg); box-shadow: var(--shadow-2); overflow:hidden; }
table.data { width:100%; border-collapse: collapse; font-size: var(--fs-sm); }
table.data thead th {
  text-align:left; font-size: var(--fs-2xs); text-transform:uppercase; letter-spacing:.05em;
  color: var(--ink-500); font-weight:600; padding: var(--sp-3) var(--sp-4); border-bottom:1px solid var(--border-hairline);
  background: var(--surface-2);
}
table.data tbody tr { transition: background var(--dur-fast) var(--ease); border-bottom:1px solid var(--border-hairline); }
table.data tbody tr:last-child { border-bottom:none; }
table.data tbody tr:nth-child(even) { background: var(--surface-2); }
table.data tbody tr:hover { background: var(--accent-teal-100); }
table.data td { padding: var(--sp-3) var(--sp-4); color: var(--ink-900); vertical-align: middle; }
table.data td.num { text-align:right; font-variant-numeric: tabular-nums; }
table.data td.muted { color: var(--ink-500); }
.row-actions { display:flex; gap: var(--sp-1); justify-content:flex-end; }

/* ============================== BADGES / STATUS ============================== */
.badge { display:inline-flex; align-items:center; gap:4px; font-size: var(--fs-2xs); font-weight:600; padding: 3px var(--sp-2); border-radius: var(--r-full); }
.badge svg { width:11px; height:11px; }
.badge-success { background: var(--success-100); color: var(--success-700); }
.badge-danger { background: var(--danger-100); color: var(--danger-700); }
.badge-warning { background: var(--warning-100); color: var(--warning-700); }
.badge-neutral { background: var(--surface-3); color: var(--ink-700); }
.badge-gold { background: var(--gold-100); color: var(--gold-700); }
.money { font-variant-numeric: tabular-nums; color: var(--gold-700); font-weight:600; }

/* ============================== FORMS ============================== */
.field { margin-bottom: var(--sp-4); }
.field label { display:block; font-size: var(--fs-xs); font-weight:600; color: var(--ink-700); margin-bottom: var(--sp-1); }
.field .req { color: var(--danger-700); }
.field input, .field select, .field textarea {
  width:100%; font-family: var(--font); font-size: var(--fs-base); padding: var(--sp-2) var(--sp-3);
  border:1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface-1); color: var(--ink-900);
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline:none; border-color: var(--accent-teal-700); box-shadow: 0 0 0 3px var(--accent-teal-100);
}
.field .help { font-size: var(--fs-2xs); color: var(--ink-500); margin-top: var(--sp-1); }
.field .error { font-size: var(--fs-2xs); color: var(--danger-700); margin-top: var(--sp-1); }

/* ============================== DEVICE FRAMES (for mobile screens) ============================== */
.phone-frame { width: 390px; border-radius: 40px; background:#000; padding: 12px; box-shadow: var(--shadow-3); }
.phone-screen { background: var(--surface-0); border-radius: 30px; overflow:hidden; min-height: 700px; }

/* ============================== MISC ============================== */
.section-header { display:flex; align-items:center; justify-content:space-between; margin: var(--sp-8) 0 var(--sp-4); }
.section-header h2 { font-size: var(--fs-lg); font-weight:650; margin:0; }
.gap-flag { display:flex; align-items:center; gap: var(--sp-3); background: var(--warning-100); border:1px solid #E8CC8F; border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); color: var(--warning-700); font-size: var(--fs-sm); font-weight:600; }
.empty-state { text-align:center; padding: var(--sp-16) var(--sp-6); color: var(--ink-500); }
.empty-state svg { width:40px; height:40px; margin-bottom: var(--sp-3); opacity:.5; }

/* ============================== LOGIN SCREEN ============================== */
.login-shell {
  min-height: 100vh; display:flex; align-items:center; justify-content:center;
  background: var(--accent-navy-800); padding: var(--sp-6);
}
.login-card { width: 100%; max-width: 400px; padding: var(--sp-8) var(--sp-8) var(--sp-6); }
.login-brand { display:flex; flex-direction:column; align-items:center; gap: var(--sp-3); margin-bottom: var(--sp-6); text-align:center; }
.login-brand .brand-mark { width: 48px; height: 48px; font-size: var(--fs-lg); }
.login-brand .brand-name { font-size: var(--fs-lg); font-weight: 700; color: var(--ink-900); }
.login-tagline { font-size: var(--fs-sm); color: var(--ink-500); text-align:center; margin: 0 0 var(--sp-8); }
.login-footer-note { display:flex; align-items:center; justify-content:center; gap: var(--sp-2); font-size: var(--fs-2xs); color: var(--ink-500); margin-top: var(--sp-6); }
.login-footer-note svg { width:13px; height:13px; flex-shrink:0; }
.btn-block { width:100%; justify-content:center; padding-top: var(--sp-3); padding-bottom: var(--sp-3); font-size: var(--fs-base); }
</style>
</head>
<body>

<div class="login-shell">
  <div class="card login-card">
    <div class="login-brand">
      <div class="brand-mark">A</div>
      <div class="brand-name">AzentisFieldOS</div>
    </div>
    <p class="login-tagline">Field operations, accounted for — sites, stock and settlements in one system.</p>

    <form>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="suresh.rao@example.com" value="suresh.rao@azentisconstruction.in">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" value="••••••••••">
      </div>

      <a href="01-dashboard.html" class="btn btn-primary btn-block">
        Sign in
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </a>
    </form>

    <div class="login-footer-note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1"/><path d="M10 21v-4h4v4"/></svg>
      Single-tenant deployment for your organisation — no tenant selection required.
    </div>
  </div>
</div>

</body>
</html>
