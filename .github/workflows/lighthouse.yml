name: Lighthouse CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/shared/**"
      - "packages/config/**"

jobs:
  lighthouse:
    name: Accessibility & performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @azentisfieldos/web build
        env:
          # Required for ClerkProvider to initialize (story 1.5). Set as
          # repository/environment secrets — see AGENTS.md for the current
          # status of this job pending those secrets being configured.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - run: pnpm --filter @azentisfieldos/web exec lhci autorun
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
