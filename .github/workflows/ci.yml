name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Reuses the root Turborepo scripts rather than hand-rolling
      # per-package steps — Turborepo's own task caching keeps unaffected
      # packages cheap/no-op.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
